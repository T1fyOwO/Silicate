name: Build Silicate

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: Win64

          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          build-config: Release
          use-lto: true
          combine: false

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Silicate-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/output/*.geode
